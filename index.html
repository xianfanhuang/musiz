<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonoria - 沉浸式音乐可视化体验</title>
    <!-- External Dependencies -->
    <link href="https://cdn.bootcdn.net/ajax/libs/material-icons/0.7.1/iconfont/material-icons.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/inter-ui/4.0.2/inter.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <!-- Internal Dependencies -->
    <link href="styles/main.css" rel="stylesheet">
    <link href="styles/components.css" rel="stylesheet">
    <link href="styles/animations.css" rel="stylesheet">
</head>
<body>
    <!-- Visualization Layers -->
    <canvas id="visualizer-3d" class="visualizer"></canvas>
    <canvas id="visualizer-2d" class="visualizer"></canvas>
    <div class="overlay"></div>
    <div class="noise-overlay"></div>

    <!-- Main Container -->
    <div class="container" id="main-container">
        <div class="bento-grid">
            <!-- Player Card -->
            <div class="bento-card player-card" id="player-card">
                <!-- Logo Section -->
                <div class="logo-section">
                    <div class="logo-container">
                        <div class="logo-orb">
                            <i class="material-icons logo-icon">music_note</i>
                        </div>
                        <div class="logo-glow"></div>
                    </div>
                    <div class="brand">
                        <h1 class="title">Sonoria</h1>
                        <p class="slogan">动人心绚，乐音之境</p>
                    </div>
                </div>

                <!-- Player Info -->
                <div class="player-info" id="player-info">
                    <div class="track-title" id="track-title"></div>
                    <div class="track-artist" id="track-artist"></div>
                </div>

                <!-- Progress Bar -->
                <div class="progress-section">
                    <div class="progress-bar">
                        <div class="progress" id="progress"></div>
                    </div>
                    <div class="time-display">
                        <span id="current-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                </div>

                <!-- Main Controls -->
                <div class="control-row">
                    <button class="icon-button" id="prev-button">
                        <i class="material-icons">skip_previous</i>
                        <span class="tooltip">上一首</span>
                    </button>
                    <button class="icon-button play-button" id="play-toggle">
                        <i class="material-icons">play_arrow</i>
                        <span class="tooltip">播放</span>
                    </button>
                    <button class="icon-button" id="next-button">
                        <i class="material-icons">skip_next</i>
                        <span class="tooltip">下一首</span>
                    </button>
                    <button class="icon-button" id="more-button">
                        <i class="material-icons">more_vert</i>
                        <span class="tooltip">更多</span>
                    </button>
                </div>

                <!-- Secondary Controls -->
                <div class="secondary-controls">
                    <button class="icon-button" id="playlist-toggle">
                        <i class="material-icons">queue_music</i>
                        <span class="tooltip">播放列表</span>
                    </button>
                    <button class="icon-button" id="upload-button">
                        <i class="material-icons">library_music</i>
                        <span class="tooltip">上传音乐</span>
                    </button>
                    <button class="icon-button" id="mic-toggle">
                        <i class="material-icons">mic_none</i>
                        <span class="tooltip">麦克风</span>
                    </button>
                </div>
            </div>

            <!-- Visual Controls Card -->
            <div class="bento-card visual-controls-card">
                <div class="visual-controls">
                    <!-- Theme Controls -->
                    <div class="control-group">
                        <h3 class="control-title">可视化主题</h3>
                        <div class="theme-selector">
                            <button class="theme-button active" data-mode="aurora">极光</button>
                            <button class="theme-button" data-mode="cosmic">宇宙</button>
                            <button class="theme-button" data-mode="neural">神经</button>
                            <button class="theme-button" data-mode="liquid">液态</button>
                            <button class="theme-button" data-mode="quantum">量子</button>
                        </div>
                    </div>

                    <!-- Visual Settings -->
                    <div class="control-group">
                        <h3 class="control-title">视觉效果设置</h3>
                        <div class="slider-container">
                            <div class="slider-label">
                                <span>灵敏度</span>
                                <span id="sensitivity-value">75%</span>
                            </div>
                            <input type="range" class="slider" id="sensitivity-slider" min="0" max="100" value="75">
                        </div>
                        <div class="slider-container">
                            <div class="slider-label">
                                <span>平滑度</span>
                                <span id="smoothing-value">85%</span>
                            </div>
                            <input type="range" class="slider" id="smoothing-slider" min="0" max="100" value="85">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Upload Area -->
        <div class="upload-area" id="upload-area">
            <i class="material-icons">library_music</i>
            <div class="upload-text">拖放音乐文件到此处或点击上传</div>
            <div class="upload-progress"></div>
        </div>

        <!-- Playlist Section -->
        <div class="playlist-section" id="playlist-section">
            <div class="playlist-header">
                <div class="playlist-title">播放列表</div>
                <div class="playlist-controls">
                    <button class="icon-button" id="close-playlist">
                        <i class="material-icons">close</i>
                    </button>
                </div>
            </div>
            <div class="playlist-items" id="playlist-items"></div>
        </div>

        <!-- Status Message -->
        <div class="status" id="status"></div>
    </div>

    <!-- Context Menu -->
    <div class="more-menu" id="more-menu">
        <div class="menu-item" id="shuffle-option">
            <i class="material-icons">shuffle</i>
            <span>随机播放</span>
        </div>
        <div class="menu-item" id="loop-option">
            <i class="material-icons">loop</i>
            <span>循环播放</span>
        </div>
        <div class="menu-item" id="clear-option">
            <i class="material-icons">clear_all</i>
            <span>清空列表</span>
        </div>
    </div>

    <!-- Swipe Hint -->
    <div class="swipe-hint" id="swipe-hint">左右滑动切换可视化主题</div>

    <!-- File Input -->
    <input type="file" id="audio-upload" accept="audio/mp3,audio/m4a,audio/wav,audio/flac,audio/*,video/mp4" multiple>

    <!-- Scripts -->
    <script src="js/visualizer.js"></script>
    <script src="js/audioProcessor.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
