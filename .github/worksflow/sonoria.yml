```yaml
name: Sonoria cleanup & placeholders

# 仅在 version0.1 分支的 push 事件触发
on:
  push:
    branches:
      - version0.1

permissions:
  contents: write

jobs:
  replace-with-placeholders:
    runs-on: ubuntu-latest
    # 防止循环触发：如果本次提交信息包含 [sonoria] 则跳过（避免工作流自推再触发）
    if: ${{ github.event.head_commit && !contains(github.event.head_commit.message, '[sonoria]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare shell (delete everything except .github, create placeholders)
        run: |
          set -euo pipefail
          # Safety: show current branch and latest commit
          echo "Running on branch: $GITHUB_REF"
          echo "Latest commit message: ${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-}" || true

          # Enable extended globbing and include dotfiles
          shopt -s extglob dotglob

          # List root content for logging
          echo "Repository root content before cleanup:"
          ls -la | sed -n '1,200p'

          # Remove all files and directories except .github and .git
          for entry in ./* ./.?*; do
            # Skip . and ..
            [[ "$entry" == "./." || "$entry" == "./.." ]] && continue
            # Keep .github and .git
            if [[ "$(basename "$entry")" == ".github" || "$(basename "$entry")" == ".git" ]]; then
              echo "Keeping $entry"
              continue
            fi
            echo "Removing $entry"
            rm -rf -- "$entry"
          done

          # Recreate placeholder files and folders
          mkdir -p styles js

          # Root config marker
          touch .nojekyll
          echo "# Sonoria placeholder config" > sonoria.yml

          # Create empty/placeholder files for the refactor (intentional minimal placeholders)
          : > index.html
          : > styles/main.css
          : > styles/components.css
          : > styles/animations.css
          : > js/visualizer.js
          : > js/audioProcessor.js
          : > js/ui.js
          : > js/main.js

          # Show resulting tree
          echo "Repository root content after placeholder creation:"
          ls -la | sed -n '1,200p'
          echo "styles/:"
          ls -la styles || true
          echo "js/:"
          ls -la js || true

      - name: Commit & push placeholders
        run: |
          set -euo pipefail
          # Configure git user (action runner)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          # If nothing to commit, exit gracefully
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(sonoria): replace repository contents with placeholders [sonoria]"
          # Push back to the same branch (version0.1)
          git push origin HEAD:refs/heads/version0.1