name: Sonoria Asset Setup
on:
  push:
    branches: [ x ]
  workflow_dispatch:

jobs:
  setup-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: version0.1

      - name: Clear all directories except .github
        run: |
          # 排除 . 和 ..，只删除非.github、非.git的一级目录
          find . -maxdepth 1 -type d ! -name "." ! -name ".." ! -name ".github" ! -name ".git" -exec rm -rf {} +
          # 排除 . 和 ..，只删除非.git开头的一级文件
          find . -maxdepth 1 -type f ! -name "." ! -name ".." ! -name ".git*" -exec rm -f {} +

      - name: Create required directories and empty files
        run: |
          : > .nojekyll
          : > index.html
          mkdir -p styles && touch styles/main.css styles/components.css styles/animations.css
          mkdir -p js && touch js/visualizer.js js/audioProcessor.js js/ui.js js/main.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Setup Sonoria required directories and empty files"
          branch: version0.1