<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonoria | 沉浸式音乐可视化体验</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/material-icons/0.7.1/iconfont/material-icons.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/inter-ui/4.0.2/inter.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <!-- 3D 可视化容器 -->
        <div id="visualizer-3d"></div>

        <!-- 2D 可视化 Canvas (回退方案) -->
        <canvas id="visualizer-2d"></canvas>

        <div class="overlay"></div>
        <div class="noise-overlay"></div>

        <!-- 性能优化提示 -->
        <div class="performance-notice" id="performance-notice">
            ⚡ 性能模式已启用
        </div>

        <div class="container" id="main-container">
            <div class="player-card" id="player-card">
                <div class="logo-section">
                    <div class="logo-circle" id="logo-circle">
                        <i class="material-icons logo-icon">music_note</i>
                    </div>
                    <div class="brand">
                        <h1 class="title" id="app-title">Sonoria</h1>
                        <p class="slogan" id="app-slogan">沉浸式音乐可视化体验</p>
                    </div>
                </div>

                <div class="player-info" id="player-info">
                    <div class="track-title" id="track-title">等待音乐输入</div>
                    <div class="track-artist" id="track-artist">上传文件或使用麦克风开始旅程</div>
                </div>

                <div class="progress-section">
                    <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress" id="progress"></div>
                    </div>
                    <div class="time-display">
                        <span id="current-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                </div>

                <div class="control-row">
                    <button class="icon-button" id="prev-button" aria-label="上一首">
                        <i class="material-icons">skip_previous</i>
                        <span class="tooltip">上一首</span>
                    </button>
                    <button class="icon-button play-button" id="play-toggle" aria-label="播放">
                        <i class="material-icons">play_arrow</i>
                        <span class="tooltip">播放</span>
                    </button>
                    <button class="icon-button" id="next-button" aria-label="下一首">
                        <i class="material-icons">skip_next</i>
                        <span class="tooltip">下一首</span>
                    </button>
                    <button class="icon-button" id="more-button" aria-label="更多选项">
                        <i class="material-icons">more_vert</i>
                        <span class="tooltip">更多</span>
                    </button>
                </div>

                <div class="secondary-controls">
                    <button class="icon-button" id="playlist-toggle" aria-label="播放列表">
                        <i class="material-icons">queue_music</i>
                        <span class="tooltip">播放列表</span>
                    </button>
                    <button class="icon-button" id="upload-button" aria-label="上传音乐">
                        <i class="material-icons">library_music</i>
                        <span class="tooltip">上传音乐</span>
                    </button>
                    <button class="icon-button" id="mic-toggle" aria-label="麦克风输入">
                        <i class="material-icons">mic_none</i>
                        <span class="tooltip">麦克风</span>
                    </button>
                    <button class="icon-button" id="viz-toggle" aria-label="切换3D可视化">
                        <i class="material-icons">3d_rotation</i>
                        <span class="tooltip">3D模式</span>
                    </button>
                </div>

                <div class="more-menu" id="more-menu">
                    <div class="menu-item" id="shuffle-option" role="menuitem" tabindex="0">
                        <i class="material-icons">shuffle</i>
                        <span id="shuffle-text">随机播放</span>
                    </div>
                    <div class="menu-item" id="loop-option" role="menuitem" tabindex="0">
                        <i class="material-icons">loop</i>
                        <span id="loop-text">循环播放</span>
                    </div>
                    <div class="menu-item" id="clear-option" role="menuitem" tabindex="0">
                        <i class="material-icons">clear_all</i>
                        <span>清空列表</span>
                    </div>
                    <div class="menu-item" id="performance-option" role="menuitem" tabindex="0">
                        <i class="material-icons">speed</i>
                        <span id="performance-text">性能模式</span>
                    </div>
                    <div class="menu-item" id="settings-option" role="menuitem" tabindex="0">
                        <i class="material-icons">settings</i>
                        <span>高级设置</span>
                    </div>
                </div>

                <div class="upload-area" id="upload-area" role="button" aria-label="Upload music files">
                    <i class="material-icons">library_music</i>
                    <div class="upload-text">拖放音乐文件或点击上传</div>
                    <div class="upload-progress" id="upload-progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>

                <div class="theme-selector">
                    <button class="theme-button active" data-mode="serene" aria-label="宁静主题">宁静</button>
                    <button class="theme-button" data-mode="aurora" aria-label="极光主题">极光</button>
                    <button class="theme-button" data-mode="cosmic" aria-label="宇宙主题">宇宙</button>
                    <button class="theme-button" data-mode="neural" aria-label="神经网络主题">神经</button>
                    <button class="theme-button" data-mode="liquid" aria-label="液态主题">液态</button>
                    <button class="theme-button" data-mode="quantum" aria-label="量子主题">量子</button>
                    <button class="theme-button" data-mode="fractal" aria-label="分形主题">分形</button>
                    <button class="theme-button" data-mode="orbital" aria-label="轨道主题">轨道</button>
                    <button class="theme-button" data-mode="crystal" aria-label="水晶主题">水晶</button>
                </div>

                <div class="visual-controls">
                    <div class="control-group">
                        <div class="control-title">视觉效果</div>
                        <div class="slider-container">
                            <div class="slider-label">
                                <span>强度</span>
                                <span id="intensity-value">75%</span>
                            </div>
                            <input type="range" class="slider" id="intensity-slider" min="0" max="100" value="75">
                        </div>
                        <div class="slider-container">
                            <div class="slider-label">
                                <span>粒子数量</span>
                                <span id="particles-value">150</span>
                            </div>
                            <input type="range" class="slider" id="particles-slider" min="50" max="300" value="150">
                        </div>
                    </div>

                    <div class="control-group">
                        <div class="control-title">颜色设置</div>
                        <div class="slider-container">
                            <div class="slider-label">
                                <span>饱和度</span>
                                <span id="saturation-value">85%</span>
                            </div>
                            <input type="range" class="slider" id="saturation-slider" min="0" max="100" value="85">
                        </div>
                        <div class="slider-container">
                            <div class="slider-label">
                                <span>亮度</span>
                                <span id="brightness-value">70%</span>
                            </div>
                            <input type="range" class="slider" id="brightness-slider" min="0" max="100" value="70">
                        </div>
                    </div>
                </div>

                <div class="playlist-section" id="playlist-section">
                    <div class="playlist-header">
                        <div class="playlist-title">播放列表</div>
                        <div class="playlist-controls">
                            <button class="icon-button" id="close-playlist" aria-label="关闭播放列表">
                                <i class="material-icons">close</i>
                            </button>
                        </div>
                    </div>

                    <div class="playlist-items" id="playlist-items">
                        <!-- 播放列表项将动态添加 -->
                    </div>
                </div>

                <div class="status" id="status" aria-live="polite">
                </div>
            </div>
        </div>
    </div>

    <!-- 语言切换器 -->
    <div class="language-switcher">
        <button class="lang-button" id="lang-toggle" aria-label="切换语言">EN/中文</button>
    </div>

    <!-- 分享按钮 -->
    <div class="share-button">
        <button class="icon-button" id="share-button" aria-label="分享可视化">
            <i class="material-icons">share</i>
        </button>
    </div>

    <div class="swipe-hint" id="swipe-hint">左右滑动切换可视化主题</div>

    <input type="file" id="audio-upload" accept="audio/mp3,audio/m4a,audio/wav,audio/flac,audio/*,video/mp4" multiple>

    <script src="app.js"></script>
</body>
</html>
